- hosts: all
  become: yes
  vars:
    site_domain: "{{ v_site_domain }}"
    web_root: "/var/www/finspace"
    db_name: "wordpresd_db"
    db_user: "{{ v_db_user }}"
    db_password: "{{ v_db_password }}"
    files_to_copy:
      - { src: "{{ v_path_to_backup_archive }}", mode: "0644" }
      - { src: "{{ v_path_to_installer_file }}", mode: "0755" }
    mysql_root_password: "{{ v_mysql_root_password }}"

  tasks:
    - name: 1. Install prerequisites for adding external repositories
      apt:
        name:
          - software-properties-common
          - curl
          - gnupg2
          - apt-transport-https
        update_cache: yes
        state: present
    
    - name: 2. Add MariaDB 13.0 repository
      deb822_repository:
        name: mariadb
        types: deb
        uris: https://mirror.docker.ru/mariadb/repo/13.0/ubuntu
        suites: "{{ ansible_distribution_release}}"
        components: main main/debug
        signed_by: https://mariadb.org/mariadb_release_signing_key.pgp
        state: present

    - name: 3. Add Ondrej PHP PPA for PHP 8.1
      apt_repository:
        repo: ppa:ondrej/php
        state: present
        update_cache: yes

    - name: 4. Install specific versions of Nginx, MariaDB, PHP-FPM and certbot
      apt:
        name:
          - nginx=1.24.0-2ubuntu7.19
          - mariadb-server=1:13.0.2+maria~ubu2404
          - mariadb-client=1:13.0.2+maria~ubu2404
          - php8.1-fpm=8.1.34-9+ubuntu24.04.1+deb.sury.org+1
          - php8.1-mysql=8.1.34-9+ubuntu24.04.1+deb.sury.org+1
          - php8.1-mbstring=8.1.34-9+ubuntu24.04.1+deb.sury.org+1
          - php8.1-xml=8.1.34-9+ubuntu24.04.1+deb.sury.org+1
          - php8.1-curl=8.1.34-9+ubuntu24.04.1+deb.sury.org+1
          - php8.1-zip=8.1.34-9+ubuntu24.04.1+deb.sury.org+1
          - php8.1-gd=8.1.34-9+ubuntu24.04.1+deb.sury.org+1
          - certbot=2.9.0-1
          - python3-certbot-nginx=2.9.0-1
          - python3-pymysql=1.0.2-2ubuntu1.1
          - unzip=6.0-28ubuntu4.1
        state: present
        allow_downgrade: yes

    - name: 5. Ensure Nginx and MariaDB services are started and enabled
      service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx
        - mariadb
        - php8.1-fpm

    - name: 6. Set root password
      command: >
        mariadb -e "ALTER USER 'root'@'localhost'
        IDENTIFIED VIA unix_socket OR mysql_native_password
        USING PASSWORD('{{ mysql_root_password }}'); FLUSH PRIVILEGES;"
      changed_when: false
      no_log: true

    - name: 7. Configure root MySQL credentials for Ansible
      copy:
        content: |
          [client]
          user=root
          password={{ mysql_root_password }}
        dest: /root/.my.cnf
        mode: '0600'
      no_log: true
    
    - name: 8. Create database for WordPress
      mysql_db:
        login_unix_socket: /run/mysqld/mysqld.sock
        name: "{{ db_name }}"
        state: present
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci

    - name: 9. Create database user and grant privileges
      mysql_user:
        login_unix_socket: /run/mysqld/mysqld.sock
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        state: present
      no_log: true

    - name: 10. Create web root directory
      file:
        path: "{{ web_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: 11. Copy Duplicator archive and installer file to the server
      copy:
        src: "{{ item.src }}"
        dest: "{{ web_root }}/{{ item.src }}"
        owner: www-data
        group: www-data
        mode: "{{ item.mode }}"
      loop: "{{ files_to_copy }}"
      loop_control:
        label: "{{ item.src }}"

    - name: 12. Configure Nginx virtual host (HTTP initial setup for Let's Encrypt validation)
      template:
        src: "nginx_first_config.j2"
        dest: "/etc/nginx/conf.d/{{ site_domain }}.conf"
      notify: Restart Nginx
    
    - name: 13. Remove default Nginx config if exists
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/etc/nginx/conf.d/default.conf"
        - "/etc/nginx/sites-enabled/default"
        - "/etc/nginx/sites-available/default"
      notify: Restart Nginx

    - name: Flush handlers to apply Nginx config before certbot
      meta: flush_handlers

    - name: 14. Obtain Let's Encrypt SSL certificate via Certbot Nginx plugin
      command: >
        certbot certonly --webroot
        -w {{ web_root }}
        -d {{ site_domain }}
        -d www.{{ site_domain }}
        --non-interactive
        --agree-tos
        -m finspace.consulting@gmail.com
        --redirect
      args:
        creates: "/etc/letsencrypt/live/{{ site_domain }}/fullchain.pem"

    - name: 15. Setup automated SSL certificate renewal cron/timer
      systemd:
        name: certbot.timer
        state: started
        enabled: yes

    - name: 16. Remove previous NGINX config
      file:
        path: "/etc/nginx/conf.d/{{ site_domain }}.conf"
        state: absent
      
    - name: 17. Configure Nginx for site Finspace
      template:
        src: "finspace_config.j2"
        dest: "/etc/nginx/conf.d/{{ site_domain }}.conf"
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
    
    - name: Restart PHP-FPM
      service:
        name: php8.1-fpm
        state: restarted
